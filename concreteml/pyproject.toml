[project]
name = "naip-matching"
version = "0.1.0"
authors = [
    { name = "Dylan-Gresham", email = "98201122+Dylan-Gresham@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "concrete-ml>=1.9.0",
    "brevitas>=0.10.2",
    "torch>=2.2.2",
    "pillow>=12.3.0",
    "numpy>=1.26.4",
    "rasterio>=1.4.4",
    "rioxarray>=0.19.0",
    "pyproj>=3.7.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "scipy-stubs~=1.15.3",
    "torchvision>=0.17.2",
    "tqdm>=4.70.0",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "platform_system == 'Linux' or platform_system == 'win32'" }]
torchvision = [{ index = "pytorch-cu121", marker = "platform_system == 'Linux' or platform_system == 'win32'" }]
